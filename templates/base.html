<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ _('title') }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-white bg-white border-bottom mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/">{{ _('title') }}</a>
            <div class="btn-group btn-group-sm">
                <a href="/set_lang/ru" class="btn btn-outline-secondary {% if current_lang == 'ru' %}active{% endif %}">RU</a>
                <a href="/set_lang/uk" class="btn btn-outline-secondary {% if current_lang == 'uk' %}active{% endif %}">UK</a>
                <a href="/set_lang/en" class="btn btn-outline-secondary {% if current_lang == 'en' %}active{% endif %}">EN</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
